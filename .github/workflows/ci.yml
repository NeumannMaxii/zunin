name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-secret-key-for-automated-testing-github-actions"
      # Al no definir DB_NAME, el proyecto utilizará SQLite para los tests de CI

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar verificación de configuración (Django Check)
        run: |
          python manage.py check

      - name: Ejecutar Suite de Tests
        run: |
          python manage.py test
